name: lab
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  hello:
    strategy:
      matrix:
        java: [17, 21]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Show the java version
        run: java -version
      - run: echo "Hello form $(hostname), running as $(whoami)"
      - run: ls -la
      - run: git log --oneline | wc -l
      - run: echo "event=${{ github.event_name }} branch=${{ github.ref_name }} commit=${{ github.sha }} "
      - name: Write a result file
        run: echo "42 tests" > result.txt
      - name: Upload the result
        uses: actions/upload-artifact@v4
        with:
          name: result-java-${{ matrix.java }}
          path: result.txt
  report:
    needs: hello
    runs-on: ubuntu-latest
    steps:
      - name: Download the results
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
      - name: Read the result files
        run: cat result-*/result.txt
